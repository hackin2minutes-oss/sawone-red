# Example gate. The mock jobs need no secrets. The staging job is commented out
# until you point it at an endpoint you own or are authorized to test.
name: sawone-red-example

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  redteam-mock-hardened:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Sawone Red against the hardened mock (gate passes)
        uses: ./
        with:
          config: examples/mock-hardened.yaml
          fail_on: high
          sarif_output: sawone-red.sarif
          report_dir: sawone-red-reports
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sawone-red.sarif

  # Shows findings in code scanning. The gate step is allowed to fail so the
  # job stays green and the SARIF still uploads; remove continue-on-error to
  # make the vulnerable mock gate CI.
  redteam-mock-vulnerable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Sawone Red against the vulnerable mock (findings expected)
        continue-on-error: true
        uses: ./
        with:
          config: examples/mock.yaml
          fail_on: high
          sarif_output: sawone-red-vulnerable.sarif
          report_dir: sawone-red-reports-vulnerable
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sawone-red-vulnerable.sarif

  # Staging example. Create the secret STAGING_API_KEY in repository settings,
  # then uncomment this job and point examples/http.yaml or examples/openai.yaml
  # at your authorized staging endpoint.
